<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Electrochemical Cause: Lithium Intercalation vs Plating</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Why the Battery Management System (BMS) forces current reduction past 80%</text>

  <!-- State 1: < 80% -->
  <rect x="40" y="100" width="345" height="300" fill="#1E293B" rx="10" stroke="#334155"/>
  <text x="212" y="132" fill="#34D399" font-size="16" font-weight="700" text-anchor="middle">Under 80% SoC: Rapid Intercalation</text>
  <text x="212" y="154" fill="#94A3B8" font-size="12" text-anchor="middle">Graphite layers have abundant vacant spaces</text>
  
  <rect x="80" y="180" width="265" height="15" fill="#475569" rx="3"/>
  <rect x="80" y="230" width="265" height="15" fill="#475569" rx="3"/>
  <rect x="80" y="280" width="265" height="15" fill="#475569" rx="3"/>
  <rect x="80" y="330" width="265" height="15" fill="#475569" rx="3"/>

  <!-- Li-ions intercalating smoothly -->
  <circle cx="120" cy="205" r="9" fill="#10B981"/><text x="120" y="209" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">Li+</text>
  <circle cx="210" cy="205" r="9" fill="#10B981"/><text x="210" y="209" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">Li+</text>
  <circle cx="160" cy="255" r="9" fill="#10B981"/><text x="160" y="259" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">Li+</text>
  <circle cx="270" cy="255" r="9" fill="#10B981"/><text x="270" y="259" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">Li+</text>

  <text x="212" y="375" fill="#38BDF8" font-size="13" font-weight="600" text-anchor="middle">✓ High Acceptor Capacity · Minimal Heat</text>

  <!-- State 2: > 80% -->
  <rect x="415" y="100" width="345" height="300" fill="#1E293B" rx="10" stroke="#EF4444" stroke-width="1.5"/>
  <text x="587" y="132" fill="#F87171" font-size="16" font-weight="700" text-anchor="middle">Over 80% SoC: Saturation Risk</text>
  <text x="587" y="154" fill="#94A3B8" font-size="12" text-anchor="middle">Forcing high amps causes metallic lithium dendrites</text>

  <rect x="455" y="180" width="265" height="15" fill="#475569" rx="3"/>
  <rect x="455" y="230" width="265" height="15" fill="#475569" rx="3"/>
  <rect x="455" y="280" width="265" height="15" fill="#475569" rx="3"/>
  <rect x="455" y="330" width="265" height="15" fill="#475569" rx="3"/>

  <!-- Saturated ions blocked -->
  <circle cx="485" cy="205" r="9" fill="#F59E0B"/><text x="485" y="209" fill="#000" font-size="10" font-weight="700" text-anchor="middle">Li+</text>
  <circle cx="535" cy="205" r="9" fill="#F59E0B"/><text x="535" y="209" fill="#000" font-size="10" font-weight="700" text-anchor="middle">Li+</text>
  <circle cx="585" cy="205" r="9" fill="#F59E0B"/><text x="585" y="209" fill="#000" font-size="10" font-weight="700" text-anchor="middle">Li+</text>
  <circle cx="635" cy="205" r="9" fill="#F59E0B"/><text x="635" y="209" fill="#000" font-size="10" font-weight="700" text-anchor="middle">Li+</text>
  <!-- Dendrite hazard -->
  <polygon points="685,175 700,160 705,178 720,165 710,195 685,185" fill="#EF4444"/>
  <text x="710" y="150" fill="#EF4444" font-size="11" font-weight="700">Dendrite!</text>

  <text x="587" y="375" fill="#EF4444" font-size="13" font-weight="600" text-anchor="middle">⚠ BMS Tapers Amps to Prevent Battery Damage</text>
  <!-- Get Eco Driver Official Vector Watermark -->
  <g transform="translate(610, 20)">
    <rect width="150" height="32" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="6" fill="#10B981"/>
    <text x="18" y="20" fill="#0F172A" font-size="10" font-weight="900" text-anchor="middle">⚡</text>
    <text x="35" y="21" fill="#F8FAFC" font-size="11" font-weight="800" letter-spacing="0.5">GET ECO DRIVER</text>
  </g>

</svg>