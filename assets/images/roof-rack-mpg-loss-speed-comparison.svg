<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Rooftop Cargo Box MPG Penalty by Highway Speed</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Tested on compact SUV (Baseline bare roof: 34 MPG @ 55 MPH / 28 MPG @ 75 MPH)</text>

  <!-- 3 Speed benchmarks -->
  <!-- 55 MPH -->
  <rect x="70" y="115" width="190" height="265" fill="#1E293B" rx="8" stroke="#10B981"/>
  <text x="165" y="145" fill="#34D399" font-size="16" font-weight="700" text-anchor="middle">55 MPH</text>
  <text x="165" y="170" fill="#94A3B8" font-size="12" text-anchor="middle">Secondary Highway</text>
  <text x="165" y="215" fill="#FFFFFF" font-size="28" font-weight="800" text-anchor="middle">30.5 MPG</text>
  <text x="165" y="240" fill="#F59E0B" font-size="14" font-weight="700" text-anchor="middle">-3.5 MPG (-10%)</text>
  <text x="165" y="280" fill="#CBD5E1" font-size="11" text-anchor="middle">Extra Fuel / 500 Mi:</text>
  <text x="165" y="300" fill="#38BDF8" font-size="13" font-weight="700" text-anchor="middle">+1.9 Gallons ($7)</text>

  <!-- 65 MPH -->
  <rect x="305" y="115" width="190" height="265" fill="#1E293B" rx="8" stroke="#38BDF8"/>
  <text x="400" y="145" fill="#38BDF8" font-size="16" font-weight="700" text-anchor="middle">65 MPH</text>
  <text x="400" y="170" fill="#94A3B8" font-size="12" text-anchor="middle">Standard Highway</text>
  <text x="400" y="215" fill="#FFFFFF" font-size="28" font-weight="800" text-anchor="middle">25.8 MPG</text>
  <text x="400" y="240" fill="#F97316" font-size="14" font-weight="700" text-anchor="middle">-5.2 MPG (-17%)</text>
  <text x="400" y="280" fill="#CBD5E1" font-size="11" text-anchor="middle">Extra Fuel / 500 Mi:</text>
  <text x="400" y="300" fill="#38BDF8" font-size="13" font-weight="700" text-anchor="middle">+3.3 Gallons ($12)</text>

  <!-- 75 MPH -->
  <rect x="540" y="115" width="190" height="265" fill="#1E293B" rx="8" stroke="#EF4444"/>
  <text x="635" y="145" fill="#F87171" font-size="16" font-weight="700" text-anchor="middle">75 MPH</text>
  <text x="635" y="170" fill="#94A3B8" font-size="12" text-anchor="middle">Interstate Freeway</text>
  <text x="635" y="215" fill="#FFFFFF" font-size="28" font-weight="800" text-anchor="middle">21.0 MPG</text>
  <text x="635" y="240" fill="#EF4444" font-size="14" font-weight="700" text-anchor="middle">-7.0 MPG (-25%)</text>
  <text x="635" y="280" fill="#CBD5E1" font-size="11" text-anchor="middle">Extra Fuel / 500 Mi:</text>
  <text x="635" y="300" fill="#38BDF8" font-size="13" font-weight="700" text-anchor="middle">+6.0 Gallons ($22)</text>

  <text x="400" y="415" fill="#FCA5A5" font-size="12" text-anchor="middle">Aerodynamic drag penalties multiply at high speeds: Drive at 65 MPH when carrying roof cargo.</text>
  <!-- Get Eco Driver Official Vector Watermark -->
  <g transform="translate(610, 20)">
    <rect width="150" height="32" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="6" fill="#10B981"/>
    <text x="18" y="20" fill="#0F172A" font-size="10" font-weight="900" text-anchor="middle">⚡</text>
    <text x="35" y="21" fill="#F8FAFC" font-size="11" font-weight="800" letter-spacing="0.5">GET ECO DRIVER</text>
  </g>

</svg>