<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Hybrid Powertrain System Start &amp; Fault Flowchart</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">What happens when the driver presses the Power button with a weak/failing battery</text>

  <!-- Step 1 -->
  <rect x="40" y="110" width="180" height="60" fill="#1E293B" rx="8" stroke="#38BDF8"/>
  <text x="130" y="135" fill="#38BDF8" font-size="13" font-weight="700" text-anchor="middle">Driver Presses Power</text>
  <text x="130" y="155" fill="#94A3B8" font-size="11" text-anchor="middle">12V energizes Hybrid ECU</text>

  <!-- Arrow -->
  <line x1="220" y1="140" x2="260" y2="140" stroke="#64748B" stroke-width="2"/>
  
  <!-- Step 2: SMR Relay Check -->
  <rect x="260" y="110" width="220" height="60" fill="#1E293B" rx="8" stroke="#F59E0B"/>
  <text x="370" y="135" fill="#F59E0B" font-size="13" font-weight="700" text-anchor="middle">SMR Relays Close</text>
  <text x="370" y="155" fill="#94A3B8" font-size="11" text-anchor="middle">Pack Voltage Tested (&gt; 200V)</text>

  <!-- Branch -->
  <line x1="480" y1="140" x2="540" y2="140" stroke="#64748B" stroke-width="2"/>

  <!-- Pass -->
  <rect x="540" y="100" width="220" height="80" fill="#10B981" fill-opacity="0.2" rx="8" stroke="#10B981"/>
  <text x="650" y="130" fill="#34D399" font-size="14" font-weight="700" text-anchor="middle">READY Light ON</text>
  <text x="650" y="150" fill="#D1FAE5" font-size="11" text-anchor="middle">MG1 cranks engine seamlessly</text>
  <text x="650" y="165" fill="#D1FAE5" font-size="11" text-anchor="middle">Normal Hybrid Drive Active</text>

  <!-- Fail -->
  <line x1="370" y1="170" x2="370" y2="240" stroke="#EF4444" stroke-width="2"/>
  <rect x="250" y="240" width="240" height="150" fill="#EF4444" fill-opacity="0.15" rx="8" stroke="#EF4444"/>
  <text x="370" y="270" fill="#F87171" font-size="14" font-weight="700" text-anchor="middle">VOLTAGE DROP DETECTED</text>
  <text x="370" y="295" fill="#FCA5A5" font-size="11" text-anchor="middle">• Cell block delta exceeds 0.3V</text>
  <text x="370" y="315" fill="#FCA5A5" font-size="11" text-anchor="middle">• ECU sets Diagnostic Trouble Code</text>
  <text x="370" y="335" fill="#FCA5A5" font-size="11" text-anchor="middle">• SMR Main Relays forced open</text>
  <text x="370" y="365" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">RESULT: NO CRANK / NO START</text>
</svg>