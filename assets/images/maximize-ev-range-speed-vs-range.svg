<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">EV Cruising Speed vs Highway Driving Range</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Tested on 75 kWh Standard Long Range Battery (EPA Rated: 300 Miles)</text>

  <!-- Grid -->
  <line x1="80" y1="360" x2="740" y2="360" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="290" x2="740" y2="290" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="80" y1="220" x2="740" y2="220" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="80" y1="150" x2="740" y2="150" stroke="#1E293B" stroke-dasharray="4"/>

  <!-- Y labels -->
  <text x="70" y="365" fill="#64748B" font-size="12" text-anchor="end">100 mi</text>
  <text x="70" y="295" fill="#64748B" font-size="12" text-anchor="end">180 mi</text>
  <text x="70" y="225" fill="#64748B" font-size="12" text-anchor="end">240 mi</text>
  <text x="70" y="155" fill="#64748B" font-size="12" text-anchor="end">300 mi</text>

  <!-- Bars for speeds -->
  <!-- 45 mph: 310 mi -->
  <rect x="110" y="140" width="85" height="220" fill="#10B981" rx="4"/>
  <text x="152" y="130" fill="#10B981" font-size="14" font-weight="700" text-anchor="middle">310 Mi</text>
  <text x="152" y="385" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">45 MPH</text>

  <!-- 55 mph: 282 mi -->
  <rect x="235" y="165" width="85" height="195" fill="#34D399" rx="4"/>
  <text x="277" y="155" fill="#34D399" font-size="14" font-weight="700" text-anchor="middle">282 Mi</text>
  <text x="277" y="385" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">55 MPH</text>

  <!-- 65 mph: 245 mi -->
  <rect x="360" y="205" width="85" height="155" fill="#38BDF8" rx="4"/>
  <text x="402" y="195" fill="#38BDF8" font-size="14" font-weight="700" text-anchor="middle">245 Mi</text>
  <text x="402" y="385" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">65 MPH</text>

  <!-- 75 mph: 202 mi -->
  <rect x="485" y="250" width="85" height="110" fill="#F59E0B" rx="4"/>
  <text x="527" y="240" fill="#F59E0B" font-size="14" font-weight="700" text-anchor="middle">202 Mi</text>
  <text x="527" y="385" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">75 MPH</text>

  <!-- 85 mph: 162 mi -->
  <rect x="610" y="295" width="85" height="65" fill="#EF4444" rx="4"/>
  <text x="652" y="285" fill="#EF4444" font-size="14" font-weight="700" text-anchor="middle">162 Mi</text>
  <text x="652" y="385" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">85 MPH</text>

  <!-- Callout line -->
  <text x="527" y="420" fill="#EF4444" font-size="12" font-weight="600" text-anchor="middle">-35% Range Penalty between 55 &amp; 75 MPH</text>
  <!-- Get Eco Driver Official Vector Watermark -->
  <g transform="translate(610, 20)">
    <rect width="150" height="32" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="6" fill="#10B981"/>
    <text x="18" y="20" fill="#0F172A" font-size="10" font-weight="900" text-anchor="middle">⚡</text>
    <text x="35" y="21" fill="#F8FAFC" font-size="11" font-weight="800" letter-spacing="0.5">GET ECO DRIVER</text>
  </g>

</svg>