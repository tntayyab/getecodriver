<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Planetary Power Split Device: Why Hybrid Cannot Run Without High-Voltage Battery</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Toyota Hybrid Synergy Drive / e-CVT physical interlock architecture</text>

  <!-- Sun Gear (MG1) -->
  <circle cx="250" cy="240" r="45" fill="#38BDF8" stroke="#0284C7" stroke-width="3"/>
  <text x="250" y="235" fill="#0F172A" font-size="12" font-weight="800" text-anchor="middle">SUN GEAR</text>
  <text x="250" y="252" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">(MG1 Motor)</text>

  <!-- Planet Carrier (ICE Engine) -->
  <circle cx="250" cy="240" r="85" fill="none" stroke="#10B981" stroke-width="4" stroke-dasharray="8"/>
  <circle cx="250" cy="155" r="22" fill="#10B981"/>
  <circle cx="325" cy="285" r="22" fill="#10B981"/>
  <circle cx="175" cy="285" r="22" fill="#10B981"/>
  <text x="250" y="160" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">ICE</text>

  <!-- Ring Gear (MG2 & Wheels) -->
  <circle cx="250" cy="240" r="120" fill="none" stroke="#F59E0B" stroke-width="5"/>
  <text x="250" y="105" fill="#FBBF24" font-size="13" font-weight="700" text-anchor="middle">RING GEAR (Connected to MG2 &amp; Wheels)</text>

  <!-- Hardware explanation box on right -->
  <rect x="420" y="110" width="340" height="280" fill="#1E293B" rx="10" stroke="#334155"/>
  <text x="440" y="145" fill="#34D399" font-size="15" font-weight="700">CRITICAL MECHANICAL REALITY:</text>
  
  <text x="440" y="175" fill="#CBD5E1" font-size="12">1. No Conventional Starter Motor:</text>
  <text x="440" y="193" fill="#94A3B8" font-size="11">   MG1 spins the gas engine to 1,000 RPM to start.</text>

  <text x="440" y="225" fill="#CBD5E1" font-size="12">2. No Mechanical Alternator:</text>
  <text x="440" y="243" fill="#94A3B8" font-size="11">   12V system is powered by high-voltage DC-DC converter.</text>

  <text x="440" y="275" fill="#CBD5E1" font-size="12">3. Sun Gear Reaction Torque Required:</text>
  <text x="440" y="293" fill="#94A3B8" font-size="11">   Without battery back-EMF, engine spins freely without</text>
  <text x="440" y="309" fill="#94A3B8" font-size="11">   transferring ANY torque to the drive wheels!</text>

  <rect x="440" y="335" width="300" height="35" fill="#EF4444" fill-opacity="0.2" rx="6" stroke="#EF4444"/>
  <text x="590" y="357" fill="#FCA5A5" font-size="11" font-weight="700" text-anchor="middle">DEAD TRACTION BATTERY = IMMOBILIZED CAR</text>
</svg>