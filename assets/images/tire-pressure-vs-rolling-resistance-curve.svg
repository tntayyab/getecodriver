<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Tire Pressure vs Fuel Efficiency (MPG Penalty Curve)</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Department of Energy &amp; NHTSA verified: -0.2% to -0.3% MPG loss per 1 PSI below placard</text>

  <!-- Placard Optimal zone -->
  <rect x="420" y="100" width="100" height="260" fill="#10B981" fill-opacity="0.1"/>
  <line x1="470" y1="100" x2="470" y2="360" stroke="#10B981" stroke-width="2" stroke-dasharray="6"/>
  <text x="470" y="125" fill="#10B981" font-size="13" font-weight="700" text-anchor="middle">PLACARD SPEC (35 PSI)</text>

  <!-- Grid -->
  <line x1="80" y1="360" x2="740" y2="360" stroke="#334155" stroke-width="1.5"/>
  <text x="120" y="385" fill="#EF4444" font-size="12" font-weight="700" text-anchor="middle">20 PSI (-43%)</text>
  <text x="230" y="385" fill="#F59E0B" font-size="12" font-weight="700" text-anchor="middle">25 PSI (-29%)</text>
  <text x="350" y="385" fill="#FBBF24" font-size="12" font-weight="700" text-anchor="middle">30 PSI (-14%)</text>
  <text x="470" y="385" fill="#34D399" font-size="13" font-weight="700" text-anchor="middle">35 PSI (Optimal)</text>
  <text x="600" y="385" fill="#38BDF8" font-size="12" font-weight="700" text-anchor="middle">42 PSI (+20%)</text>

  <!-- Curve -->
  <path d="M 120 340 Q 230 290 350 200 Q 470 150 600 135" fill="none" stroke="#38BDF8" stroke-width="4"/>
  <circle cx="120" cy="340" r="6" fill="#EF4444"/>
  <text x="135" y="335" fill="#EF4444" font-size="13" font-weight="700">-6.5% MPG &amp; Severe Overheating</text>

  <circle cx="230" cy="290" r="6" fill="#F59E0B"/>
  <text x="245" y="285" fill="#F59E0B" font-size="12" font-weight="700">-3.2% MPG</text>

  <circle cx="470" cy="150" r="6" fill="#10B981"/>
  <text x="485" y="155" fill="#10B981" font-size="13" font-weight="700">0% Baseline</text>

  <circle cx="600" cy="135" r="6" fill="#38BDF8"/>
  <text x="615" y="130" fill="#38BDF8" font-size="12" font-weight="700">+1.1% MPG (Ride Harsher)</text>
  <!-- Get Eco Driver Official Vector Watermark -->
  <g transform="translate(610, 20)">
    <rect width="150" height="32" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="6" fill="#10B981"/>
    <text x="18" y="20" fill="#0F172A" font-size="10" font-weight="900" text-anchor="middle">⚡</text>
    <text x="35" y="21" fill="#F8FAFC" font-size="11" font-weight="800" letter-spacing="0.5">GET ECO DRIVER</text>
  </g>

</svg>