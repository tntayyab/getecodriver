<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Cruise Control on Hills: Throttle Surge &amp; Downshift Penalty</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Why robotic speed-locking wastes up to 14% more fuel on rolling terrain</text>

  <!-- Hill profile -->
  <path d="M 80 340 Q 240 330 360 210 Q 420 150 480 210 Q 600 330 740 340" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <text x="420" y="140" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">Crest of Hill</text>

  <!-- Automated Cruise behavior -->
  <path d="M 120 310 Q 240 300 360 180" fill="none" stroke="#EF4444" stroke-width="3"/>
  <rect x="220" y="170" width="180" height="44" fill="#EF4444" fill-opacity="0.2" rx="6" stroke="#EF4444"/>
  <text x="310" y="190" fill="#FCA5A5" font-size="12" font-weight="700" text-anchor="middle">CRUISE CONTROL (BAD):</text>
  <text x="310" y="206" fill="#F87171" font-size="11" text-anchor="middle">Forces downshift &amp; 90% throttle</text>

  <!-- Skilled driver behavior -->
  <rect x="440" y="240" width="220" height="44" fill="#10B981" fill-opacity="0.2" rx="6" stroke="#10B981"/>
  <text x="550" y="260" fill="#6EE7B7" font-size="12" font-weight="700" text-anchor="middle">SMART DRIVER (EFFICIENT):</text>
  <text x="550" y="276" fill="#34D399" font-size="11" text-anchor="middle">Allows speed to bleed 3-4 MPH uphill</text>

  <text x="400" y="405" fill="#F8FAFC" font-size="13" text-anchor="middle">Automated cruise cannot see terrain ahead; human kinetic momentum management wins.</text>
</svg>