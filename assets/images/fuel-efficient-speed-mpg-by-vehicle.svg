<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Fuel Economy (MPG) Across Vehicle Classes by Speed</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Measured in miles per gallon: Higher frontal area vehicles suffer steepest loss</text>

  <!-- Legend -->
  <circle cx="480" cy="45" r="6" fill="#10B981"/><text x="495" y="49" fill="#94A3B8" font-size="12">55 MPH</text>
  <circle cx="580" cy="45" r="6" fill="#38BDF8"/><text x="595" y="49" fill="#94A3B8" font-size="12">65 MPH</text>
  <circle cx="680" cy="45" r="6" fill="#EF4444"/><text x="695" y="49" fill="#94A3B8" font-size="12">75 MPH</text>

  <!-- Sedan -->
  <text x="60" y="125" fill="#F8FAFC" font-size="15" font-weight="700">Aerodynamic Sedan (e.g., Honda Civic / Toyota Camry)</text>
  <rect x="60" y="140" width="450" height="18" fill="#10B981" rx="3"/><text x="520" y="154" fill="#10B981" font-size="13" font-weight="700">42 MPG</text>
  <rect x="60" y="163" width="395" height="18" fill="#38BDF8" rx="3"/><text x="465" y="177" fill="#38BDF8" font-size="13" font-weight="700">37 MPG (-12%)</text>
  <rect x="60" y="186" width="330" height="18" fill="#EF4444" rx="3"/><text x="400" y="200" fill="#EF4444" font-size="13" font-weight="700">31 MPG (-26%)</text>

  <!-- Midsize SUV / Crossover -->
  <text x="60" y="235" fill="#F8FAFC" font-size="15" font-weight="700">Compact / Midsize SUV (e.g., Toyota RAV4 / CR-V)</text>
  <rect x="60" y="250" width="365" height="18" fill="#10B981" rx="3"/><text x="435" y="264" fill="#10B981" font-size="13" font-weight="700">34 MPG</text>
  <rect x="60" y="273" width="310" height="18" fill="#38BDF8" rx="3"/><text x="380" y="287" fill="#38BDF8" font-size="13" font-weight="700">29 MPG (-15%)</text>
  <rect x="60" y="296" width="245" height="18" fill="#EF4444" rx="3"/><text x="315" y="310" fill="#EF4444" font-size="13" font-weight="700">23 MPG (-32%)</text>

  <!-- Full-Size Truck -->
  <text x="60" y="345" fill="#F8FAFC" font-size="15" font-weight="700">Full-Size Pickup Truck (e.g., Ford F-150 / Silverado)</text>
  <rect x="60" y="360" width="255" height="18" fill="#10B981" rx="3"/><text x="325" y="374" fill="#10B981" font-size="13" font-weight="700">24 MPG</text>
  <rect x="60" y="383" width="200" height="18" fill="#38BDF8" rx="3"/><text x="270" y="397" fill="#38BDF8" font-size="13" font-weight="700">19 MPG (-21%)</text>
  <rect x="60" y="406" width="160" height="18" fill="#EF4444" rx="3"/><text x="230" y="420" fill="#EF4444" font-size="13" font-weight="700">15 MPG (-38%)</text>
</svg>