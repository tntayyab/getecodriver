<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Brake Specific Fuel Consumption (BSFC) Sweet Spot</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Why internal combustion engines burn less fuel under load than feathering at low power</text>

  <!-- Axes -->
  <line x1="80" y1="360" x2="740" y2="360" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="100" x2="80" y2="360" stroke="#334155" stroke-width="1.5"/>
  <text x="740" y="390" fill="#94A3B8" font-size="12" text-anchor="end">Engine RPM →</text>
  <text x="60" y="95" fill="#94A3B8" font-size="12">Torque (Nm) ↑</text>

  <!-- BSFC contour islands -->
  <ellipse cx="360" cy="210" rx="160" ry="80" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1.5"/>
  <ellipse cx="360" cy="210" rx="110" ry="55" fill="#F59E0B" fill-opacity="0.25" stroke="#F59E0B" stroke-width="1.5"/>
  <ellipse cx="360" cy="210" rx="60" ry="30" fill="#10B981" fill-opacity="0.4" stroke="#10B981" stroke-width="2"/>

  <!-- Peak efficiency dot -->
  <circle cx="360" cy="210" r="6" fill="#10B981"/>
  <text x="360" y="200" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">PEAK EFFICIENCY ISLAND</text>
  <text x="360" y="235" fill="#D1FAE5" font-size="11" text-anchor="middle">215 g/kWh (~39% Thermal)</text>

  <!-- Normal steady driving dot (wasteful low torque) -->
  <circle cx="280" cy="320" r="6" fill="#EF4444"/>
  <text x="295" y="325" fill="#F87171" font-size="12" font-weight="600">Steady Cruising (~20% Efficiency / Throttle Choked)</text>

  <!-- Pulse target -->
  <path d="M 285 315 L 350 220" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4"/>
  <text x="340" y="270" fill="#38BDF8" font-size="11" font-weight="700">Pulse climbs here</text>
  <!-- Get Eco Driver Official Vector Watermark -->
  <g transform="translate(610, 20)">
    <rect width="150" height="32" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="6" fill="#10B981"/>
    <text x="18" y="20" fill="#0F172A" font-size="10" font-weight="900" text-anchor="middle">⚡</text>
    <text x="35" y="21" fill="#F8FAFC" font-size="11" font-weight="800" letter-spacing="0.5">GET ECO DRIVER</text>
  </g>

</svg>