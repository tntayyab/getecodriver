<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Kinematic Viscosity (cSt) from Cold Start to Operating Temp</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">0W-20 Full Synthetic flows instantly vs conventional 10W-30 syrup dragging down cold MPG</text>

  <!-- Grid -->
  <line x1="80" y1="360" x2="740" y2="360" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="365" fill="#64748B" font-size="12" text-anchor="end">8 cSt (Hot)</text>
  <text x="70" y="270" fill="#64748B" font-size="12" text-anchor="end">150 cSt</text>
  <text x="70" y="160" fill="#64748B" font-size="12" text-anchor="end">800 cSt (Cold)</text>

  <!-- 10W-30 Conventional Curve -->
  <path d="M 100 130 Q 240 240 450 330 Q 600 350 720 355" fill="none" stroke="#EF4444" stroke-width="4"/>
  <text x="140" y="145" fill="#F87171" font-size="13" font-weight="700">10W-30 Conventional (High Parasitic Drag)</text>

  <!-- 0W-20 Full Synthetic Curve -->
  <path d="M 100 230 Q 240 310 450 345 Q 600 355 720 358" fill="none" stroke="#10B981" stroke-width="4"/>
  <text x="140" y="245" fill="#34D399" font-size="13" font-weight="700">0W-20 Full Synthetic (Instant Flow / Low Drag)</text>

  <!-- Temperatures -->
  <text x="100" y="385" fill="#64748B" font-size="12" text-anchor="middle">-20°C (Freeze)</text>
  <text x="280" y="385" fill="#64748B" font-size="12" text-anchor="middle">20°C (Ambient)</text>
  <text x="500" y="385" fill="#64748B" font-size="12" text-anchor="middle">70°C (Warm-up)</text>
  <text x="700" y="385" fill="#64748B" font-size="12" text-anchor="middle">100°C (Normal Operating)</text>

  <rect x="80" y="405" width="650" height="30" fill="#1E293B" rx="6"/>
  <text x="405" y="425" fill="#F8FAFC" font-size="12" text-anchor="middle">Synthetic delivers 75% less hydrodynamic pumping friction during the first 10 minutes of driving.</text>
  <!-- Get Eco Driver Official Vector Watermark -->
  <g transform="translate(610, 20)">
    <rect width="150" height="32" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="6" fill="#10B981"/>
    <text x="18" y="20" fill="#0F172A" font-size="10" font-weight="900" text-anchor="middle">⚡</text>
    <text x="35" y="21" fill="#F8FAFC" font-size="11" font-weight="800" letter-spacing="0.5">GET ECO DRIVER</text>
  </g>

</svg>