<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Cruise Control Decision Matrix: When to Engage vs Cancel</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Terrain and traffic conditions determining MPG benefits versus penalties</text>

  <!-- 3 Columns -->
  <!-- Col 1: Flat Highway -->
  <rect x="40" y="100" width="225" height="300" fill="#1E293B" rx="10" stroke="#10B981" stroke-width="2"/>
  <text x="152" y="135" fill="#34D399" font-size="16" font-weight="700" text-anchor="middle">Flat Interstate</text>
  <text x="152" y="160" fill="#10B981" font-size="20" font-weight="800" text-anchor="middle">+7% to +10% MPG</text>
  <text x="152" y="185" fill="#94A3B8" font-size="12" text-anchor="middle">VERDICT: ALWAYS ON</text>
  <line x1="60" y1="205" x2="245" y2="205" stroke="#334155"/>
  <text x="60" y="230" fill="#E2E8F0" font-size="12">• Eliminates micro-surges</text>
  <text x="60" y="255" fill="#E2E8F0" font-size="12">• Perfect throttle steadiness</text>
  <text x="60" y="280" fill="#E2E8F0" font-size="12">• Optimal lockup torque</text>

  <!-- Col 2: Rolling Hills -->
  <rect x="287" y="100" width="225" height="300" fill="#1E293B" rx="10" stroke="#EF4444" stroke-width="2"/>
  <text x="399" y="135" fill="#F87171" font-size="16" font-weight="700" text-anchor="middle">Rolling Mountain/Hills</text>
  <text x="399" y="160" fill="#EF4444" font-size="20" font-weight="800" text-anchor="middle">-8% to -14% MPG</text>
  <text x="399" y="185" fill="#94A3B8" font-size="12" text-anchor="middle">VERDICT: TURN OFF</text>
  <line x1="307" y1="205" x2="492" y2="205" stroke="#334155"/>
  <text x="307" y="230" fill="#E2E8F0" font-size="12">• Aggressive gear hunting</text>
  <text x="307" y="255" fill="#E2E8F0" font-size="12">• Wastes fuel fighting grade</text>
  <text x="307" y="280" fill="#E2E8F0" font-size="12">• Brakes on downhills</text>

  <!-- Col 3: Stop-and-Go Traffic -->
  <rect x="535" y="100" width="225" height="300" fill="#1E293B" rx="10" stroke="#F59E0B" stroke-width="2"/>
  <text x="647" y="135" fill="#FBBF24" font-size="16" font-weight="700" text-anchor="middle">Adaptive in Traffic</text>
  <text x="647" y="160" fill="#F59E0B" font-size="20" font-weight="800" text-anchor="middle">-5% to -12% MPG</text>
  <text x="647" y="185" fill="#94A3B8" font-size="12" text-anchor="middle">VERDICT: CONVENIENCE ONLY</text>
  <line x1="555" y1="205" x2="740" y2="205" stroke="#334155"/>
  <text x="555" y="230" fill="#E2E8F0" font-size="12">• Abrupt friction braking</text>
  <text x="555" y="255" fill="#E2E8F0" font-size="12">• Late gap-closing throttle</text>
  <text x="555" y="280" fill="#E2E8F0" font-size="12">• Loss of coasting energy</text>
</svg>