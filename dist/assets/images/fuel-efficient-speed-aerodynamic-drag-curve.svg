<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Aerodynamic Drag Force Formula: F_d = ½ ρ v² C_d A</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Why fuel economy falls off a cliff past 55 to 60 MPH due to the square of velocity</text>

  <line x1="80" y1="360" x2="740" y2="360" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="290" x2="740" y2="290" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="80" y1="220" x2="740" y2="220" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="80" y1="150" x2="740" y2="150" stroke="#1E293B" stroke-dasharray="4"/>

  <text x="70" y="365" fill="#64748B" font-size="12" text-anchor="end">0 HP</text>
  <text x="70" y="290" fill="#64748B" font-size="12" text-anchor="end">15 HP</text>
  <text x="70" y="220" fill="#64748B" font-size="12" text-anchor="end">35 HP</text>
  <text x="70" y="150" fill="#64748B" font-size="12" text-anchor="end">65 HP</text>

  <!-- Curve path -->
  <path d="M 100 350 Q 280 340 400 305 Q 520 260 620 180 Q 700 110 740 95" fill="none" stroke="#EF4444" stroke-width="4"/>
  
  <rect x="280" y="285" width="140" height="40" fill="#10B981" rx="6"/>
  <text x="350" y="310" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">50-58 MPH SWEET SPOT</text>

  <text x="120" y="385" fill="#64748B" font-size="12" text-anchor="middle">35 MPH</text>
  <text x="250" y="385" fill="#64748B" font-size="12" text-anchor="middle">50 MPH</text>
  <text x="380" y="385" fill="#10B981" font-size="13" font-weight="700" text-anchor="middle">58 MPH</text>
  <text x="510" y="385" fill="#F59E0B" font-size="12" text-anchor="middle">70 MPH</text>
  <text x="640" y="385" fill="#EF4444" font-size="13" font-weight="700" text-anchor="middle">80 MPH</text>

  <text x="640" y="160" fill="#EF4444" font-size="13" font-weight="700">Drag quadruples from 40 to 80 MPH</text>
  <text x="640" y="180" fill="#94A3B8" font-size="12">Requires 45+ HP solely to push air</text>
</svg>