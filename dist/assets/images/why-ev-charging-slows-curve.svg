<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <defs>
    <linearGradient id="fastGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="taperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="48" fill="#F8FAFC" font-size="20" font-weight="700">EV DC Fast Charging Power Curve: Constant Current vs Tapering</text>
  <text x="40" y="74" fill="#94A3B8" font-size="13">Kilowatt delivery drops dramatically past 80% State of Charge (SoC) to safeguard lithium cells</text>

  <!-- Grid lines -->
  <line x1="80" y1="360" x2="740" y2="360" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="290" x2="740" y2="290" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="80" y1="220" x2="740" y2="220" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="80" y1="150" x2="740" y2="150" stroke="#1E293B" stroke-dasharray="4"/>

  <!-- Y-Axis labels -->
  <text x="68" y="365" fill="#64748B" font-size="12" text-anchor="end">0 kW</text>
  <text x="68" y="295" fill="#64748B" font-size="12" text-anchor="end">50 kW</text>
  <text x="68" y="225" fill="#64748B" font-size="12" text-anchor="end">100 kW</text>
  <text x="68" y="155" fill="#64748B" font-size="12" text-anchor="end">150 kW</text>

  <!-- X-Axis labels -->
  <text x="80" y="388" fill="#64748B" font-size="12" text-anchor="middle">10%</text>
  <text x="212" y="388" fill="#64748B" font-size="12" text-anchor="middle">30%</text>
  <text x="344" y="388" fill="#64748B" font-size="12" text-anchor="middle">50%</text>
  <text x="476" y="388" fill="#64748B" font-size="12" text-anchor="middle">70%</text>
  <text x="542" y="388" fill="#F59E0B" font-size="13" font-weight="700" text-anchor="middle">80%</text>
  <text x="674" y="388" fill="#64748B" font-size="12" text-anchor="middle">100%</text>

  <!-- Zones -->
  <rect x="80" y="100" width="462" height="260" fill="#10B981" fill-opacity="0.05"/>
  <rect x="542" y="100" width="198" height="260" fill="#EF4444" fill-opacity="0.05"/>
  <line x1="542" y1="100" x2="542" y2="360" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6"/>
  
  <text x="311" y="125" fill="#10B981" font-size="14" font-weight="700" text-anchor="middle">FAST CHARGE ZONE (10% to 80%)</text>
  <text x="311" y="145" fill="#94A3B8" font-size="12" text-anchor="middle">Time: ~28 Mins · High Current Flow</text>

  <text x="641" y="125" fill="#EF4444" font-size="14" font-weight="700" text-anchor="middle">TAPER ZONE (80% to 100%)</text>
  <text x="641" y="145" fill="#94A3B8" font-size="12" text-anchor="middle">Time: ~35 Mins · Extreme Slowdown</text>

  <!-- Charging curve path -->
  <path d="M 80 160 Q 140 145 220 150 Q 380 165 476 195 Q 542 225 580 280 Q 640 330 740 345" fill="none" stroke="#38BDF8" stroke-width="4"/>
  <circle cx="80" cy="160" r="5" fill="#38BDF8"/>
  <circle cx="542" cy="225" r="6" fill="#F59E0B" stroke="#0F172A" stroke-width="2"/>
  <circle cx="740" cy="345" r="5" fill="#EF4444"/>

  <text x="555" y="220" fill="#F59E0B" font-size="12" font-weight="700">80% Knee Point (~95 kW → 40 kW)</text>
  <text x="735" y="335" fill="#EF4444" font-size="12" text-anchor="end">100% (~12 kW trickle)</text>
  <!-- Get Eco Driver Official Vector Watermark -->
  <g transform="translate(610, 20)">
    <rect width="150" height="32" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="6" fill="#10B981"/>
    <text x="18" y="20" fill="#0F172A" font-size="10" font-weight="900" text-anchor="middle">⚡</text>
    <text x="35" y="21" fill="#F8FAFC" font-size="11" font-weight="800" letter-spacing="0.5">GET ECO DRIVER</text>
  </g>

</svg>