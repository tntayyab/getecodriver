<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Mechanical Engine Parasitic Friction Loss Distribution</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Where low-viscosity synthetic oils reduce boundary and hydrodynamic friction</text>

  <!-- Bar 1: Piston & Rings (45%) -->
  <text x="40" y="125" fill="#F8FAFC" font-size="14" font-weight="600">Piston Assembly &amp; Piston Rings Friction</text>
  <text x="740" y="125" fill="#38BDF8" font-size="15" font-weight="700" text-anchor="end">45% of Total Mechanical Loss</text>
  <rect x="40" y="135" width="700" height="24" fill="#1E293B" rx="6"/>
  <rect x="40" y="135" width="315" height="24" fill="#38BDF8" rx="6"/>

  <!-- Bar 2: Valvetrain & Camshaft (28%) -->
  <text x="40" y="195" fill="#F8FAFC" font-size="14" font-weight="600">Valvetrain, Camshaft Lobes &amp; Lifters</text>
  <text x="740" y="195" fill="#34D399" font-size="15" font-weight="700" text-anchor="end">28% of Total Mechanical Loss</text>
  <rect x="40" y="205" width="700" height="24" fill="#1E293B" rx="6"/>
  <rect x="40" y="205" width="196" height="24" fill="#34D399" rx="6"/>

  <!-- Bar 3: Crankshaft & Bearings (19%) -->
  <text x="40" y="265" fill="#F8FAFC" font-size="14" font-weight="600">Crankshaft Journal &amp; Connecting Rod Bearings</text>
  <text x="740" y="265" fill="#FBBF24" font-size="15" font-weight="700" text-anchor="end">19% of Total Mechanical Loss</text>
  <rect x="40" y="275" width="700" height="24" fill="#1E293B" rx="6"/>
  <rect x="40" y="275" width="133" height="24" fill="#FBBF24" rx="6"/>

  <!-- Bar 4: Oil Pump Fluid Shear (8%) -->
  <text x="40" y="335" fill="#F8FAFC" font-size="14" font-weight="600">Oil Pump Hydraulic Shear &amp; Windage</text>
  <text x="740" y="335" fill="#A78BFA" font-size="15" font-weight="700" text-anchor="end">8% of Total Mechanical Loss</text>
  <rect x="40" y="345" width="700" height="24" fill="#1E293B" rx="6"/>
  <rect x="40" y="345" width="56" height="24" fill="#A78BFA" rx="6"/>

  <!-- Summary note -->
  <text x="400" y="415" fill="#10B981" font-size="13" font-weight="700" text-anchor="middle">RESULT: Upgrading from conventional 10W-30 to synthetic 0W-20 yields a verified +1.5% to +2.5% MPG gain.</text>
  <!-- Get Eco Driver Official Vector Watermark -->
  <g transform="translate(610, 20)">
    <rect width="150" height="32" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="6" fill="#10B981"/>
    <text x="18" y="20" fill="#0F172A" font-size="10" font-weight="900" text-anchor="middle">⚡</text>
    <text x="35" y="21" fill="#F8FAFC" font-size="11" font-weight="800" letter-spacing="0.5">GET ECO DRIVER</text>
  </g>

</svg>