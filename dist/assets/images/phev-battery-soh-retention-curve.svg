<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">PHEV State of Health (SOH) Degradation Over 10 Years</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Impact of active liquid thermal management vs passive air cooling</text>

  <!-- Grid -->
  <line x1="80" y1="360" x2="740" y2="360" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="290" x2="740" y2="290" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="80" y1="220" x2="740" y2="220" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="80" y1="150" x2="740" y2="150" stroke="#1E293B" stroke-dasharray="4"/>

  <text x="70" y="155" fill="#64748B" font-size="12" text-anchor="end">100%</text>
  <text x="70" y="225" fill="#64748B" font-size="12" text-anchor="end">85%</text>
  <text x="70" y="295" fill="#64748B" font-size="12" text-anchor="end">70% (Warranty Line)</text>
  <text x="70" y="365" fill="#64748B" font-size="12" text-anchor="end">55%</text>

  <!-- Warranty threshold line -->
  <line x1="80" y1="290" x2="740" y2="290" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6"/>
  <text x="735" y="280" fill="#EF4444" font-size="11" text-anchor="end">8-Yr / 100k Mile Warranty Floor (70%)</text>

  <!-- Liquid cooled curve -->
  <path d="M 80 150 Q 240 170 400 195 Q 560 215 720 230" fill="none" stroke="#10B981" stroke-width="4"/>
  <text x="725" y="225" fill="#34D399" font-size="12" font-weight="700">Liquid Cooled (82% SOH)</text>

  <!-- Air cooled curve -->
  <path d="M 80 150 Q 240 200 400 245 Q 560 295 720 330" fill="none" stroke="#F59E0B" stroke-width="4"/>
  <text x="725" y="340" fill="#FBBF24" font-size="12" font-weight="700">Air Cooled (62% SOH)</text>

  <!-- X axis years -->
  <text x="80" y="385" fill="#64748B" font-size="12" text-anchor="middle">Year 0</text>
  <text x="240" y="385" fill="#64748B" font-size="12" text-anchor="middle">Year 3</text>
  <text x="400" y="385" fill="#64748B" font-size="12" text-anchor="middle">Year 5</text>
  <text x="560" y="385" fill="#64748B" font-size="12" text-anchor="middle">Year 8</text>
  <text x="720" y="385" fill="#64748B" font-size="12" text-anchor="middle">Year 10</text>
</svg>