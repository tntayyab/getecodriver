<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">The Anatomy of Pulse and Glide Driving Cycle</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Alternating high-thermal-efficiency acceleration with zero-fuel coasting</text>

  <!-- Speed curve -->
  <line x1="80" y1="360" x2="740" y2="360" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="365" fill="#64748B" font-size="12" text-anchor="end">30 MPH</text>
  <text x="70" y="270" fill="#64748B" font-size="12" text-anchor="end">40 MPH</text>
  <text x="70" y="175" fill="#64748B" font-size="12" text-anchor="end">50 MPH</text>

  <!-- Pulse 1 -->
  <rect x="100" y="110" width="160" height="250" fill="#10B981" fill-opacity="0.1"/>
  <text x="180" y="135" fill="#34D399" font-size="15" font-weight="700" text-anchor="middle">PHASE 1: PULSE</text>
  <text x="180" y="155" fill="#94A3B8" font-size="12" text-anchor="middle">Moderate 75% Throttle</text>
  <text x="180" y="175" fill="#94A3B8" font-size="12" text-anchor="middle">Accelerate: 35 → 48 MPH</text>
  <path d="M 100 320 Q 150 250 260 190" fill="none" stroke="#10B981" stroke-width="4"/>

  <!-- Glide 1 -->
  <rect x="260" y="110" width="260" height="250" fill="#38BDF8" fill-opacity="0.1"/>
  <text x="390" y="135" fill="#38BDF8" font-size="15" font-weight="700" text-anchor="middle">PHASE 2: GLIDE</text>
  <text x="390" y="155" fill="#94A3B8" font-size="12" text-anchor="middle">Engine OFF / Zero Amps</text>
  <text x="390" y="175" fill="#94A3B8" font-size="12" text-anchor="middle">Coast: 48 → 35 MPH</text>
  <path d="M 260 190 Q 380 250 520 320" fill="none" stroke="#38BDF8" stroke-width="4"/>

  <!-- Pulse 2 -->
  <rect x="520" y="110" width="160" height="250" fill="#10B981" fill-opacity="0.1"/>
  <text x="600" y="135" fill="#34D399" font-size="15" font-weight="700" text-anchor="middle">PHASE 3: PULSE</text>
  <text x="600" y="155" fill="#94A3B8" font-size="12" text-anchor="middle">Re-engage Peak BSFC</text>
  <path d="M 520 320 Q 570 250 680 190" fill="none" stroke="#10B981" stroke-width="4"/>

  <!-- Explanatory note -->
  <text x="400" y="410" fill="#F8FAFC" font-size="13" text-anchor="middle">Engine operates at 38% thermal efficiency during pulse vs 18% during steady-state low-load cruising.</text>
  <!-- Get Eco Driver Official Vector Watermark -->
  <g transform="translate(610, 20)">
    <rect width="150" height="32" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="6" fill="#10B981"/>
    <text x="18" y="20" fill="#0F172A" font-size="10" font-weight="900" text-anchor="middle">⚡</text>
    <text x="35" y="21" fill="#F8FAFC" font-size="11" font-weight="800" letter-spacing="0.5">GET ECO DRIVER</text>
  </g>

</svg>