<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Rooftop Accessories: Drag Area (Cd × A) Increase</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Wind tunnel data on aerodynamic drag penalties for various roof configurations</text>

  <!-- Item 1: Bare Aero Crossbars -->
  <text x="40" y="125" fill="#F8FAFC" font-size="14" font-weight="600">Factory Bare Aerodynamic Crossbars (Empty)</text>
  <text x="740" y="125" fill="#34D399" font-size="15" font-weight="700" text-anchor="end">+4% to +8% Drag</text>
  <rect x="40" y="135" width="700" height="24" fill="#1E293B" rx="6"/>
  <rect x="40" y="135" width="56" height="24" fill="#34D399" rx="6"/>

  <!-- Item 2: Square/Round Aftermarket Bars -->
  <text x="40" y="195" fill="#F8FAFC" font-size="14" font-weight="600">Non-Aero Square Steel Crossbars (Empty)</text>
  <text x="740" y="195" fill="#FBBF24" font-size="15" font-weight="700" text-anchor="end">+10% to +14% Drag</text>
  <rect x="40" y="205" width="700" height="24" fill="#1E293B" rx="6"/>
  <rect x="40" y="205" width="98" height="24" fill="#FBBF24" rx="6"/>

  <!-- Item 3: Cargo Box -->
  <text x="40" y="265" fill="#F8FAFC" font-size="14" font-weight="600">Hard-Shell Aerodynamic Rooftop Cargo Box</text>
  <text x="740" y="265" fill="#F97316" font-size="15" font-weight="700" text-anchor="end">+19% to +26% Drag</text>
  <rect x="40" y="275" width="700" height="24" fill="#1E293B" rx="6"/>
  <rect x="40" y="275" width="182" height="24" fill="#F97316" rx="6"/>

  <!-- Item 4: Upright Mountain Bicycles -->
  <text x="40" y="335" fill="#F8FAFC" font-size="14" font-weight="600">Two Upright Bicycles on Roof Trays</text>
  <text x="740" y="335" fill="#EF4444" font-size="15" font-weight="700" text-anchor="end">+32% to +45% Drag</text>
  <rect x="40" y="345" width="700" height="24" fill="#1E293B" rx="6"/>
  <rect x="40" y="345" width="315" height="24" fill="#EF4444" rx="6"/>

  <text x="400" y="415" fill="#F8FAFC" font-size="13" text-anchor="middle">Removing empty roof crossbars when not in use saves ~$120 to $200 per 15,000 miles.</text>
</svg>