<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:12px;">
  <rect width="800" height="450" fill="#0F172A" rx="12"/>
  <text x="40" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Why PHEV Batteries Degrade Faster Than Pure BEVs</text>
  <text x="40" y="72" fill="#94A3B8" font-size="13">Cycle frequency and depth of discharge (DoD) stress comparison</text>

  <!-- PHEV Column -->
  <rect x="50" y="105" width="330" height="295" fill="#1E293B" rx="10" stroke="#F59E0B"/>
  <text x="215" y="135" fill="#F59E0B" font-size="16" font-weight="700" text-anchor="middle">PHEV (12 to 18 kWh Pack)</text>
  <text x="215" y="155" fill="#94A3B8" font-size="12" text-anchor="middle">Toyota RAV4 Prime / Chrysler Pacifica</text>
  <line x1="70" y1="170" x2="360" y2="170" stroke="#334155"/>

  <text x="70" y="200" fill="#CBD5E1" font-size="13">• Full Cycle Frequency: <tspan fill="#EF4444" font-weight="700">300-365 Cycles/Year</tspan></text>
  <text x="70" y="225" fill="#CBD5E1" font-size="13">• Depth of Discharge: <tspan fill="#EF4444" font-weight="700">85% to 90% Every Day</tspan></text>
  <text x="70" y="250" fill="#CBD5E1" font-size="13">• Discharge C-Rate: <tspan fill="#EF4444" font-weight="700">3C to 5C (High Stress)</tspan></text>
  <text x="70" y="275" fill="#CBD5E1" font-size="13">• 10-Yr SOH Retention: <tspan fill="#F59E0B" font-weight="700">72% to 78%</tspan></text>
  
  <rect x="70" y="310" width="290" height="65" fill="#EF4444" fill-opacity="0.15" rx="6"/>
  <text x="215" y="335" fill="#FCA5A5" font-size="12" font-weight="700" text-anchor="middle">HIGH CYCLIC BURDEN</text>
  <text x="215" y="355" fill="#CBD5E1" font-size="11" text-anchor="middle">Small battery must supply full car power alone.</text>

  <!-- BEV Column -->
  <rect x="420" y="105" width="330" height="295" fill="#1E293B" rx="10" stroke="#10B981"/>
  <text x="585" y="135" fill="#34D399" font-size="16" font-weight="700" text-anchor="middle">Pure EV (75 to 100 kWh Pack)</text>
  <text x="585" y="155" fill="#94A3B8" font-size="12" text-anchor="middle">Tesla Model Y / Hyundai Ioniq 5</text>
  <line x1="440" y1="170" x2="730" y2="170" stroke="#334155"/>

  <text x="440" y="200" fill="#CBD5E1" font-size="13">• Full Cycle Frequency: <tspan fill="#10B981" font-weight="700">50-70 Cycles/Year</tspan></text>
  <text x="440" y="225" fill="#CBD5E1" font-size="13">• Depth of Discharge: <tspan fill="#10B981" font-weight="700">20% to 50% Daily Commute</tspan></text>
  <text x="440" y="250" fill="#CBD5E1" font-size="13">• Discharge C-Rate: <tspan fill="#10B981" font-weight="700">0.5C to 1C (Gentle Stress)</tspan></text>
  <text x="440" y="275" fill="#CBD5E1" font-size="13">• 10-Yr SOH Retention: <tspan fill="#10B981" font-weight="700">85% to 91%</tspan></text>

  <rect x="440" y="310" width="290" height="65" fill="#10B981" fill-opacity="0.15" rx="6"/>
  <text x="585" y="335" fill="#34D399" font-size="12" font-weight="700" text-anchor="middle">GENTLE BUFFERED CYCLING</text>
  <text x="585" y="355" fill="#CBD5E1" font-size="11" text-anchor="middle">Load is distributed across 4x more lithium cells.</text>
</svg>